<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{performanceEdit.id}" required="true"/>
        <f:viewAction action="#{performanceEdit.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Edit performance</h2></header>
            <h:form onreset="onReset()" enctype="multipart/form-data">
                <div>
                    <h:outputText id="date" value="#{performanceEdit.performance.date}" />
                </div>

                <div>
                    <div>
                        <h:outputLabel for="performanceType" value="Performance type:"/>
                        <h:inputText id="performanceType" value="#{performanceEdit.performance.performanceType}"/>
                    </div>
                </div>
                <ui:repeat value="#{performanceEdit.locations}" var="location">
                    <div class="form-check">
                        <h:selectOneRadio id="radioId" group="location"
                                          value="#{performanceEdit.performance.location}">
                            <f:selectItem itemValue="#{location}" itemLabel="#{location.streetAddress}"/>
                        </h:selectOneRadio>
                    </div>
                </ui:repeat>
                <div class="button-container">
                    <h:commandButton class="button" value="Update"
                                     action="#{performanceEdit.saveAction()}"/>
                    <h:commandButton class="button" type="reset" value="Reset"/>
                </div>
            </h:form>
        </article>
    </ui:define>

</ui:composition>
