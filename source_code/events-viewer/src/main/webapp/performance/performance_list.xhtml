<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <h:outputStylesheet library="performance" name="css/performance_list.css"/>

        <article>
            <header><h2>Performances</h2></header>

            <h:dataTable value="#{performanceList.performances.performances}" var="performance">

                <h:column>
                    <f:facet name="header">date</f:facet>
                    <h:outputText value="#{performance.date}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Version</f:facet>
                    <h:outputText value="#{performance.version}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">Created</f:facet>
                    <h:outputText value="#{performance.creationDateTime}">
                        <f:convertDateTime type="localDateTime" pattern="yyyy-MM-dd HH:mm"/>
                    </h:outputText>
                </h:column>

                <h:column>
                    <f:facet name="header">Edited</f:facet>
                    <h:outputText value="#{performance.modifiedDateTime}">
                        <f:convertDateTime type="localDateTime" pattern="yyyy-MM-dd HH:mm"/>
                    </h:outputText>
                </h:column>


                <h:column>
                    <f:facet name="header">View</f:facet>
                    <h:link outcome="/performance/performance_view.xhtml" value="View">
                        <f:param name="id" value="#{performance.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Edit</f:facet>
                    <h:link outcome="/performance/performance_edit.xhtml" value="Edit">
                        <f:param name="id" value="#{performance.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Delete</f:facet>
                    <h:form>
                        <h:commandButton value="Delete"
                                         action="#{performanceList.deleteAction(performance)}"/>
                    </h:form>
                </h:column>

                <f:facet name="footer">
                    <h:button outcome="/performance/performance_create.xhtml"
                              value="Create new performance"/>
                </f:facet>
            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
