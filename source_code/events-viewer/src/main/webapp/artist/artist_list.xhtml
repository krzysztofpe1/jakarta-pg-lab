<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">
    <ui:define name="content">
        <article class="text--justified">
            <header><h2>Artists</h2></header>
            <h:dataTable value="#{artistList.artists.artists}" var="artist"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">
                <h:column>
                    <f:facet name="header">#{messages.login}</f:facet>
                    <h:outputText value="#{artist.lastName}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">#{messages.delete}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{messages.delete}"
                                         action="#{artistList.deleteAction(artist)}"/>
                    </h:form>
                </h:column>
            </h:dataTable>
        </article>
    </ui:define>
</ui:composition>
