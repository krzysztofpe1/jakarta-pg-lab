<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <f:loadBundle var="msg" basename="krzysztof.pecyna.eventsViewer.view.all.i18n.messages"/>
        <article class="text--justified">
            <header><h2>#{msg.locations}:</h2></header>
            <h:dataTable value="#{locationList.locations.locations}" var="location">
                <h:column>
                    <h:link outcome="/location/location_view.xhtml">
                        <h:outputText value="#{location.streetAddress}"/>
                        <f:param name="id" value="#{location.id}"/>
                    </h:link>
                </h:column>
                <h:column>
                    <h:form rendered="#{facesContext.externalContext.isUserInRole('admin')}">
                        <h:commandButton styleClass="btn" value="Delete"
                                         action="#{locationList.deleteAction(location)}"
                                         rendered="#{facesContext.externalContext.isUserInRole('admin')}"/>
                    </h:form>
                </h:column>
            </h:dataTable>
        </article>
    </ui:define>
</ui:composition>
